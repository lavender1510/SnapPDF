name: Signed release smoke

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag containing the signed APK asset
        type: string
        required: true
        default: v1.0.0
      expected_sha256:
        description: Independently verified SHA-256 of SnapPDF-TAG.apk
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: signed-release-smoke-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  install-and-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SNAPPDF_RELEASE_TAG: ${{ inputs.tag }}
      SNAPPDF_EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Download and verify the exact signed release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/release-smoke.sh prepare
      - name: Enable hardware acceleration
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch the verified production APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          heap-size: 512M
          disk-size: 4096M
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash .github/scripts/release-smoke.sh run
      - name: Upload signature, manifest and runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SnapPDF-signed-release-smoke-evidence
          path: app/build/outputs/release-smoke/
          if-no-files-found: ignore

