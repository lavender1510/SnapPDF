name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test, lint and build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SnapPDF-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  instrumented-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Enable hardware acceleration
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run native Android tests on API 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          heap-size: 512M
          disk-size: 4096M
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash .github/scripts/connected-check.sh
      - name: Upload native test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-API35-test-evidence
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/qa/
          if-no-files-found: ignore

  signed-build:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check signing configuration
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.SNAPPDF_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SNAPPDF_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SNAPPDF_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SNAPPDF_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Signing secrets are not configured. No release APK will be built or published.'
          fi
      - uses: actions/checkout@v4
        if: steps.signing.outputs.configured == 'true'
      - uses: actions/setup-java@v4
        if: steps.signing.outputs.configured == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: steps.signing.outputs.configured == 'true'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.signing.outputs.configured == 'true'
      - name: Install SDK packages
        if: steps.signing.outputs.configured == 'true'
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore signing key
        if: steps.signing.outputs.configured == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.SNAPPDF_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/snappdf-release.jks"
      - name: Build and verify signed APK
        if: steps.signing.outputs.configured == 'true'
        env:
          SNAPPDF_KEYSTORE: ${{ runner.temp }}/snappdf-release.jks
          SNAPPDF_STORE_PASSWORD: ${{ secrets.SNAPPDF_STORE_PASSWORD }}
          SNAPPDF_KEY_ALIAS: ${{ secrets.SNAPPDF_KEY_ALIAS }}
          SNAPPDF_KEY_PASSWORD: ${{ secrets.SNAPPDF_KEY_PASSWORD }}
        shell: bash
        run: |
          ./gradlew --no-daemon lintRelease assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk > app/build/outputs/apk/release/SHA256SUMS.txt
      - name: Upload signed release artifact
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SnapPDF-signed-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
      - name: Remove local signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/snappdf-release.jks"
